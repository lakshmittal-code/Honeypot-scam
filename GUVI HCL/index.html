<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Honey-Pot | Command Center</title>
    <!-- Using Google Fonts for a tech/cyber look -->
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e17;
            --card-bg: #111a2f;
            --text-primary: #e0e6ed;
            --text-secondary: #94a3b8;
            --accent-green: #00f0ff;
            /* Neon Cyan */
            --accent-red: #ff2a6d;
            --border-color: #1e293b;
            --hover-bg: rgba(0, 240, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 23, 0.95);
            flex-shrink: 0;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            border: 1px solid var(--accent-green);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            /* Sidebar, Main content, Session List */
            gap: 1px;
            background-color: var(--border-color);
            overflow: hidden;
        }

        section {
            background-color: var(--bg-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        h2::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
            flex-shrink: 0;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Lists (Sessions/Intel) */
        .data-list-container {
            flex: 1;
            overflow-y: auto;
        }

        .data-list {
            list-style: none;
        }

        .data-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .data-item:hover {
            background: var(--card-bg);
        }

        /* Active State for History Items */
        .data-item.active {
            border-left: 3px solid var(--accent-green);
            background: var(--hover-bg);
        }

        .item-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
            color: var(--text-primary);
        }

        .item-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* Chat Area */
        #chat-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 1rem;
            padding-bottom: 2rem;
        }

        .chat-container::-webkit-scrollbar {
            width: 5px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            flex-shrink: 0;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.scammer {
            align-self: flex-start;
            background: var(--card-bg);
            border-left: 3px solid var(--accent-red);
        }

        .message.agent {
            align-self: flex-end;
            background: rgba(0, 240, 255, 0.05);
            border-right: 3px solid var(--accent-green);
            text-align: right;
        }

        .msg-role {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Simulator Input Area */
        .simulator-input-area {
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            background: var(--bg-color);
        }

        input:focus {
            outline: 1px solid var(--accent-green);
        }

        /* Delete Button for Sessions */
        .delete-btn {
            float: right;
            color: var(--accent-red);
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .data-item:hover .delete-btn {
            opacity: 1;
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">HCL GUVI // HONEY-POT</div>
        <div class="status-badge">SYSTEM ACTIVE</div>
    </header>

    <main>
        <!-- LEFT PANEL: Intelligence -->
        <section id="intel-panel">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-sessions-count">0</div>
                    <div class="stat-label">Total Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="msg-count">0</div>
                    <div class="stat-label">Msgs Intercepted</div>
                </div>
            </div>

            <h2>Extracted Intelligence</h2>
            <div class="data-list-container">
                <div id="intel-list" class="data-list">
                    <div class="data-item">
                        <span class="item-subtitle">No intelligence extracted yet...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- MIDDLE PANEL: Live Chat -->
        <section id="chat-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Live Interception</h2>
                <span id="current-session-id"
                    style="font-family: 'JetBrains Mono'; color: var(--accent-green); font-size: 0.8rem;">SESSION:
                    NEW</span>
            </div>

            <div id="chat-container" class="chat-container">
                <!-- Messages go here -->
                <div class="message scammer">
                    <span class="msg-role">SYSTEM</span>
                    Waiting for scammer activity...
                </div>
            </div>

            <!-- SIMULATOR INPUT -->
            <div class="simulator-input-area">
                <h3 style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">SIMULATE SCAMMER
                </h3>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="sim-input" placeholder="Type a message (e.g., 'You won a lottery...')"
                        style="flex: 1; padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--card-bg); color: white; font-family: 'Inter';"
                        onkeypress="handleKeyPress(event)">

                    <button onclick="sendScamMessage()"
                        style="background: var(--accent-red); color: white; border: none; padding: 0 1.5rem; border-radius: 4px; cursor: pointer; font-weight: 600;">
                        SEND
                    </button>

                    <!-- NEW SESSION BUTTON -->
                    <button onclick="createNewSession()" title="Start New Session"
                        style="background: var(--card-bg); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 0 1rem; border-radius: 4px; cursor: pointer;">
                        + New
                    </button>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Chat History (Session List) -->
        <section id="sessions-panel">
            <h2>Chat History</h2>
            <div class="data-list-container">
                <ul id="session-list" class="data-list">
                    <!-- Dynamic Session Items will be injected here via JS -->
                </ul>
            </div>
        </section>
    </main>

    <script>
        // --- DATA STRUCTURES ---
        // We will store sessions here. Each session is an object: 
        // { id: timestamp, title: "Preview text...", messages: [], timestamp: readableTime }
        let sessions = [];
        let currentSessionId = null;

        // --- INITIALIZATION ---
        window.onload = function () {
            // Load from local storage if available (optional persistence)
            const stored = localStorage.getItem('honeyPotSessions');
            if (stored) {
                sessions = JSON.parse(stored);
                renderSessionList();
            }

            // Start a new session immediately if none exists or as default
            createNewSession();
        };

        // --- CORE FUNCTIONS ---

        function createNewSession() {
            const timestamp = Date.now();
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newSession = {
                id: timestamp,
                title: `Session ${sessions.length + 1}`,
                subtitle: `Started at ${timeString}`,
                messages: [] // Empty start
            };

            sessions.unshift(newSession); // Add to top of list
            currentSessionId = newSession.id;

            // Clear Chat UI
            document.getElementById('chat-container').innerHTML = `
                <div class="message scammer">
                    <span class="msg-role">SYSTEM</span>
                    Session initialized. Waiting for input...
                </div>
            `;

            updateUI();
        }

        function switchSession(sessionId) {
            currentSessionId = sessionId;
            const sessionData = sessions.find(s => s.id === sessionId);

            if (!sessionData) return;

            // Render Messages
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = ''; // Clear current view

            if (sessionData.messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="message scammer">
                        <span class="msg-role">SYSTEM</span>
                        Empty session history.
                    </div>`;
            } else {
                sessionData.messages.forEach(msg => {
                    appendMessageToUI(msg.role, msg.text, false); // false = don't save again
                });
            }

            updateUI();
        }

        function sendScamMessage() {
            const input = document.getElementById('sim-input');
            const text = input.value.trim();
            if (!text) return;

            // 1. Add Scammer Message
            addMessage('scammer', text);
            input.value = '';

            // 2. BACKEND INTEGRATION POINT
            // Since you have a backend file, trigger your backend call here.
            // Example:
            // sendToBackend(text);
            //
            // When your backend responds, call the function below:
            // addMessage('agent', backendResponseText);
        }

        // --- PUBLIC HELPER FOR BACKEND ---
        // You can call this function from your backend script
        // Example: window.addMessage('agent', 'Response from AI');
        function addMessage(role, text) {
            // Find current session
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            // Add to data structure
            session.messages.push({ role, text });

            // Update Session Title with first message snippet if it's the first real message
            if (session.messages.length === 1 && role === 'scammer') {
                session.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
            }

            // Save & Render
            appendMessageToUI(role, text, true);
            updateUI();
        }

        function appendMessageToUI(role, text, shouldScroll) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            // Proper labeling
            const label = role === 'scammer' ? 'SCAMMER (TARGET)' : 'AI AGENT';

            div.innerHTML = `
                <span class="msg-role">${label}</span>
                ${text}
            `;
            container.appendChild(div);

            if (shouldScroll) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // --- UI UPDATES ---

        function updateUI() {
            renderSessionList();
            saveToLocalStorage();

            // Update Stats
            document.getElementById('total-sessions-count').innerText = sessions.length;

            let totalMsgs = sessions.reduce((acc, s) => acc + s.messages.length, 0);
            document.getElementById('msg-count').innerText = totalMsgs;

            document.getElementById('current-session-id').innerText = `ID: #${currentSessionId.toString().slice(-4)}`;
        }

        function renderSessionList() {
            const list = document.getElementById('session-list');
            list.innerHTML = '';

            sessions.forEach(session => {
                const li = document.createElement('li');
                li.className = `data-item ${session.id === currentSessionId ? 'active' : ''}`;
                li.onclick = () => switchSession(session.id);

                li.innerHTML = `
                    <span class="item-title">${session.title}</span>
                    <span class="item-subtitle">${session.subtitle} • ${session.messages.length} msgs</span>
                `;
                list.appendChild(li);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('honeyPotSessions', JSON.stringify(sessions));
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendScamMessage();
        }

    </script>
</body>

</html>
